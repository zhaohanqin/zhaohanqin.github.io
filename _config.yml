# yaml-language-server: $schema=none


# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# =========================================================
# Site
# =========================================================

title: 照汗青的个人博客
subtitle: '记录技术、生活和思考'
description: '一个专注于技术分享和个人成长的博客，涵盖编程、生活和思考。'

keywords:
  - 博客
  - 技术
  - 生活

author: HanQin-Zhao
language: zh-CN
timezone: 'Asia/Shanghai'


# =========================================================
# URL
# =========================================================

url: https://zhaohanqin.github.io
root: /

permalink: :year/:month/:day/:title/
permalink_defaults:

pretty_urls:
  trailing_index: false
  trailing_html: false


# =========================================================
# Directory
# =========================================================

source_dir: source
public_dir: public

tag_dir: tags
archive_dir: archives
category_dir: categories

code_dir: downloads/code
i18n_dir: :lang

skip_render:
  - "demos/**/*"


# =========================================================
# Writing
# =========================================================

new_post_name: :title.md
default_layout: post

titlecase: false

external_link:
  enable: true
  field: site
  exclude: ''

filename_case: 0

render_drafts: false

# 每篇文章可以拥有自己的资源目录
post_asset_folder: true

relative_link: false
future: true


# =========================================================
# Markdown Renderer
# 使用 hexo-renderer-markdown-it
# =========================================================

markdown:
  preset: default

  render:
    # 允许 Markdown 中直接使用 HTML
    html: true

    # 不使用 XHTML 格式
    xhtmlOut: false

    # 普通换行不强制转换为 <br>
    # 对技术文章、公式和代码更稳妥
    breaks: false

    # 自动识别 URL
    linkify: true

    # 禁止自动替换引号、破折号等字符
    # 避免影响技术文章和数学公式
    typographer: false

  # KaTeX 数学公式插件
  plugins:
    - '@renbaoshuo/markdown-it-katex'


# =========================================================
# Syntax Highlighting
# 使用 Hexo 内置 highlight.js
# =========================================================

syntax_highlighter: highlight.js

highlight:
  # 显示代码行号
  line_number: true

  # 不自动猜测代码语言
  # 建议 Markdown 中显式写 ```python / ```java 等
  auto_detect: false

  tab_replace: ''

  # 使用 Hexo 的代码块包装结构
  wrap: true

  # 暂时保持 false，与 Butterfly 配合
  hljs: false


# =========================================================
# Home Page
# =========================================================

index_generator:
  path: ''
  per_page: 10
  order_by: -date


# =========================================================
# Category & Tag
# =========================================================

default_category: uncategorized

category_map:

tag_map:


# =========================================================
# Metadata
# =========================================================

meta_generator: true


# =========================================================
# Date / Time
# =========================================================

date_format: YYYY-MM-DD
time_format: HH:mm:ss

updated_option: 'mtime'


# =========================================================
# Pagination
# =========================================================

per_page: 10
pagination_dir: page


# =========================================================
# Include / Exclude
# =========================================================

# include:
# exclude:
# ignore:


# =========================================================
# Theme
# =========================================================

theme: butterfly


# =========================================================
# Deployment
# =========================================================

deploy:
  type: ''

